services:

  # ---------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: techmarket-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672" #protocolo AMQP - lo usan ms-productos y ms-pedidos
      - "15672:15672" #panel de administracion web usuario/clave guest/guest
    networks:
      - techmarket-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: techmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: TechMarket
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - techmarket_postgres_data:/var/lib/postgresql/data
    networks:
      - techmarket-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d TechMarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------
  productos:
    build:
      context: ./TechMarket_Productos/TechMarket_Productos
      dockerfile: Dockerfile
    container_name: techmarket-productos
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: ms-productos
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      ConnectionStrings__TechMarketDb: "Host=postgres;Port=5432;Database=TechMarket;Username=${DB_USER};Password=${DB_PASSWORD}"
      RabbitMq__ConnectionString: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiraMinutos: ${JWT_EXPIRA_MINUTOS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq: 
        condition: service_healthy
    ports:
      - "5230:8080"
    networks:
      - techmarket-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  pedidos:
    build:
      context: ./TechMarket_Pedidos/TechMarket_Pedidos
      dockerfile: Dockerfile
    container_name: techmarket-pedidos
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: ms-pedidos
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      ConnectionStrings__TechMarketPedidos: "Host=postgres;Port=5432;Database=TechMarketPedidos;Username=${DB_USER};Password=${DB_PASSWORD}"
      Servicios__Productos__BaseUrl: "http://productos:8080"
      RabbitMq__ConnectionString: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
    depends_on:
      productos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5121:8080"
    networks:
      - techmarket-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  gateway:
    build:
      context: ./TechMarket_Gateway/TechMarket_Gateway
      dockerfile: Dockerfile
    container_name: techmarket-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: ms-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      ReverseProxy__Clusters__cluster-productos__Destinations__destino-1__Address: "http://productos:8080"
      ReverseProxy__Clusters__cluster-pedidos__Destinations__destino-1__Address: "http://pedidos:8080"
    depends_on:
      productos:
        condition: service_healthy
      pedidos:
        condition: service_healthy
    ports:
      - "5029:8080"
    networks:
      - techmarket-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: techmarket-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" #interfaz web de Jaeger para ver las trazas
    networks:
      - techmarket-net

# ----------------------------------------------------------
networks:
  techmarket-net:
    driver: bridge

volumes:
  techmarket_postgres_data: